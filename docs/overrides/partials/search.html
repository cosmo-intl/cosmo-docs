<div class="md-search" role="dialog" aria-label="Search documentation">
  <label class="md-search__overlay" for="__search"></label>
  <div class="md-search__inner" role="search" data-doc-search
       data-index-url="{{ 'search/search_index.json' | url }}" data-base-url="{{ base_url }}/">
    <form class="md-search__form" name="doc-search">
      <input type="search" class="md-search__input" name="query"
             aria-label="Search this language's documentation" placeholder="Search this language"
             autocomplete="off" spellcheck="false" aria-controls="doc-search-results">
      <label class="md-search__icon md-icon" for="__search">
        {% include ".icons/material/magnify.svg" %}
        {% include ".icons/material/arrow-left.svg" %}
      </label>
      <nav class="md-search__options" aria-label="Search options">
        <button type="reset" class="md-search__icon md-icon" aria-label="Clear search">
          {% include ".icons/material/close.svg" %}
        </button>
      </nav>
    </form>
    <div class="md-search__output">
      <div class="md-search__scrollwrap" tabindex="0">
        <div class="md-search-result">
          <div class="md-search-result__meta" data-doc-search-status aria-live="polite">Type to search this language</div>
          <ol class="md-search-result__list" id="doc-search-results"></ol>
        </div>
      </div>
    </div>
  </div>
</div>
